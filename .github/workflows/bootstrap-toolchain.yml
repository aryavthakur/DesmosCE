name: Provision CE runtime libraries
on:
  push:
    branches: [feat/native-core]
    paths: [.github/workflows/bootstrap-toolchain.yml]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: Download upstream v15.0 runtime libraries
        run: |
          curl --fail --location --retry 3 https://github.com/CE-Programming/libraries/releases/download/v15.0/clibs_separately_in_zip.zip -o ce-runtime-v15.zip
          sha256sum ce-runtime-v15.zip > ce-runtime-v15.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ce-runtime-v15
          path: |
            ce-runtime-v15.zip
            ce-runtime-v15.sha256
          retention-days: 3
